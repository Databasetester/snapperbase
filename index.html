<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapperBase v58 | Live Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0c0e; --panel: #16161a; --border: #2d2d33;
            --text: #ececee; --mute: #888891; --accent: #fa243c; 
            --success: #10b981; --warn: #f59e0b; --info: #3b82f6;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        header { height: 50px; background: #000; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
        .logo { font-weight: 800; font-size: 14px; letter-spacing: 1px; color: #fff; }
        .logo span { color: var(--accent); }
        .search-wrap input { background: #111; border: 1px solid var(--border); color: #fff; padding: 8px 12px 8px 35px; border-radius: 6px; width: 400px; outline: none; font-size: 12px; }
        .workspace { display: flex; flex: 1; overflow: hidden; }
        nav { width: 200px; background: var(--panel); border-right: 1px solid var(--border); padding: 20px 0; flex-shrink: 0; }
        .nav-item { padding: 12px 20px; color: var(--mute); cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.2s; border-left: 3px solid transparent; }
        .nav-item.active { background: #1f1f24; color: #fff; border-left-color: var(--accent); }
        .view { display: none; flex: 1; overflow: hidden; flex-direction: column; }
        .view.active { display: flex; }
        #summary.active { display: grid; grid-template-columns: 350px 1fr; }
        .col-side { border-right: 1px solid var(--border); overflow-y: auto; padding: 25px; background: #0f0f12; }
        .col-main { overflow-y: auto; background: var(--bg); }
        .data-grid { width: 100%; border-collapse: collapse; }
        .data-grid th { text-align: left; padding: 12px 20px; font-size: 10px; color: var(--mute); border-bottom: 1px solid var(--border); background: #000; position: sticky; top: 0; }
        .data-grid td { padding: 14px 20px; border-bottom: 1px solid #1c1c21; font-size: 12px; }
        .sch-card { background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .sch-card:hover { border-color: var(--accent); }
    </style>
</head>
<body onload="bootSystem()">

<header>
    <div class="logo">SNAPPER<span>BASE</span></div>
    <div class="search-wrap">
        <input type="text" id="omniSearch" placeholder="SEARCH ARTIST, TITLE, OR CAT...">
    </div>
    <div style="font-size: 10px; font-family: 'JetBrains Mono';">STATUS: <span id="sysStatus" style="color:var(--warn)">BOOTING</span></div>
</header>

<div class="workspace">
    <nav>
        <div class="nav-item active" data-target="summary">Summary View</div>
        <div class="nav-item" data-target="schedule">Global Schedule</div>
        <div class="nav-item" data-target="manufacturing">Manufacturing</div>
    </nav>

    <main id="summary" class="view active">
        <section class="col-side">
            <div style="width:100%; aspect-ratio:1; background:#000; border:1px solid var(--border); margin-bottom:20px; display:flex; align-items:center; justify-content:center; color:#333; font-size:10px;">LIVE SYNC</div>
            <table style="width:100%; font-size:11px; border-collapse:collapse;">
                <tr><td style="padding:10px 0; color:var(--mute);">CAT#</td><td id="vCat" style="text-align:right;">—</td></tr>
                <tr><td style="padding:10px 0; color:var(--mute);">BARCODE</td><td id="vBar" style="text-align:right;">—</td></tr>
                <tr><td style="padding:10px 0; color:var(--mute);">PRICE</td><td id="vPrice" style="text-align:right;">—</td></tr>
            </table>
        </section>
        <section class="col-main">
            <div style="padding: 35px 40px; background: #111; border-bottom: 1px solid var(--border);">
                <h1 id="vTitle" style="margin:0; font-size:24px;">Ready</h1>
                <p id="vArtist" style="color:var(--mute); margin:5px 0;">Wait for "LIVE" status to search.</p>
            </div>
            <table class="data-grid">
                <thead><tr><th>Pos</th><th>Track Title</th><th>ISRC / Time</th></tr></thead>
                <tbody id="trackBody"></tbody>
            </table>
        </section>
    </main>

    <main id="schedule" class="view">
        <div id="schGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto;"></div>
    </main>

    <main id="manufacturing" class="view">
        <div style="flex:1; overflow:auto;"><table class="data-grid"><thead><tr><th>Cat#</th><th>Format</th><th>Colour</th></tr></thead><tbody id="mfgBody"></tbody></table></div>
    </main>
</div>

<script>
    let db = { cat: [], trk: [], mfg: [] };

    // --- 1. THE AUTO-SYNC BOOT ---
    async function bootSystem() {
        const status = document.getElementById('sysStatus');
        try {
            // VERBATIM FILENAMES FROM YOUR REPOSITORY
            const files = [
                { id: 'cat', name: 'catalog.csv' },
                { id: 'trk', name: 'Tracks.csv' },
                { id: 'mfg', name: 'maun.csv' }
            ];

            for (const file of files) {
                status.innerText = `SYNCING ${file.name}...`;
                const response = await fetch(file.name);
                if (!response.ok) throw new Error("Missing " + file.name);
                const text = await response.text();
                db[file.id] = parseCSV(text);
            }

            status.innerText = "LIVE";
            status.style.color = "var(--success)";
            renderAll();
        } catch (e) {
            status.innerText = "ERROR: CHECK FILENAMES";
            status.style.color = "var(--accent)";
            console.error(e);
        }
    }

    function parseCSV(text) {
        const rows = text.split(/\r?\n/).filter(l => l.trim() !== '');
        if(!rows.length) return [];
        const headers = rows[0].split(',').map(h => h.trim().replace(/"/g,''));
        return rows.slice(1).map(row => {
            const values = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
            let obj = {};
            headers.forEach((h, i) => obj[h] = (values[i] || "").replace(/"/g,'').trim());
            return obj;
        });
    }

    function getVal(obj, aliases) {
        if(!obj) return '';
        const keys = Object.keys(obj);
        for (let a of aliases) {
            let k = keys.find(key => key.toLowerCase().replace(/[\s_]/g, '') === a.toLowerCase().replace(/[\s_]/g, ''));
            if (k) return obj[k];
        }
        return '';
    }

    function renderAll(f = '') {
        const term = f.toUpperCase();
        
        // Render Schedule
        const items = db.cat.filter(i => {
            const combined = (getVal(i, ['Catalogue']) + getVal(i, ['Title']) + getVal(i, ['Artist'])).toUpperCase();
            return combined.includes(term);
        });

        document.getElementById('schGrid').innerHTML = items.slice(0, 100).map(i => `
            <div class="sch-card" onclick="loadRecord('${getVal(i, ['Catalogue'])}')">
                <div style="font-weight:700; color:#fff;">${getVal(i, ['Title'])}</div>
                <div style="font-size:11px; color:var(--mute)">${getVal(i, ['Artist'])}</div>
                <div style="font-size:9px; color:var(--accent); margin-top:8px;">${getVal(i, ['Catalogue'])}</div>
            </div>`).join('');

        // Render Mfg
        const mfgs = db.mfg.filter(m => getVal(m, ['Catalogue']).toUpperCase().includes(term));
        document.getElementById('mfgBody').innerHTML = mfgs.slice(0, 100).map(m => `
            <tr><td>${getVal(m, ['Catalogue'])}</td><td>${getVal(m, ['Package', 'format'])}</td><td>${getVal(m, ['Vinyl Colour', 'Colour'])}</td></tr>`).join('');
    }

    function loadRecord(id) {
        const item = db.cat.find(x => getVal(x, ['Catalogue']).toUpperCase() === id.toUpperCase());
        if(!item) return;

        document.getElementById('vCat').textContent = getVal(item, ['Catalogue']);
        document.getElementById('vBar').textContent = getVal(item, ['UPCEAN', 'barcode']);
        document.getElementById('vPrice').textContent = getVal(item, ['UKDP', 'price']);
        document.getElementById('vTitle').textContent = getVal(item, ['Title']);
        document.getElementById('vArtist').textContent = getVal(item, ['Artist']);

        // Filter Tracks by current Catalogue ID
        const tracks = db.trk.filter(t => getVal(t, ['Catalogue']).toUpperCase() === id.toUpperCase());
        document.getElementById('trackBody').innerHTML = tracks.map(t => `
            <tr>
                <td>${getVal(t, ['Track_Number', 'pos'])}</td>
                <td><b>${getVal(t, ['Track_Name', 'title'])}</b></td>
                <td style="font-family:monospace; font-size:10px; color:var(--mute);">${getVal(t, ['ISRC'])}<br>${getVal(t, ['Track_Time', 'time'])}</td>
            </tr>`).join('');
        
        switchTab('summary');
    }

    function switchTab(id) {
        document.querySelectorAll('.nav-item, .view').forEach(el => el.classList.remove('active'));
        document.querySelector(`[data-target="${id}"]`).classList.add('active');
        document.getElementById(id).classList.add('active');
    }

    document.getElementById('omniSearch').oninput = (e) => renderAll(e.target.value);
    document.querySelectorAll('.nav-item').forEach(i => i.onclick = () => switchTab(i.dataset.target));
</script>
</body>
</html>
