<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapperBase v49 | Aggressive Retrieval</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0c0e; --panel: #16161a; --border: #2d2d33;
            --text: #ececee; --mute: #888891; --accent: #fa243c; 
            --success: #10b981; --warn: #f59e0b; --info: #3b82f6;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header { height: 50px; background: #000; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
        .logo { font-weight: 800; font-size: 14px; letter-spacing: 1px; color: #fff; }
        .logo span { color: var(--accent); }
        
        .search-wrap { position: relative; }
        .search-wrap input { background: #111; border: 1px solid var(--border); color: #fff; padding: 8px 12px 8px 35px; border-radius: 6px; width: 450px; outline: none; font-size: 12px; }
        .search-wrap svg { position: absolute; left: 10px; top: 9px; color: var(--mute); }

        .workspace { display: flex; flex: 1; overflow: hidden; }
        nav { width: 220px; background: var(--panel); border-right: 1px solid var(--border); padding: 20px 0; flex-shrink: 0; }
        .nav-item { padding: 12px 20px; color: var(--mute); cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.2s; border-left: 3px solid transparent; }
        .nav-item.active { background: #1f1f24; color: #fff; border-left-color: var(--accent); }

        .view { display: none; flex: 1; overflow: hidden; flex-direction: column; }
        .view.active { display: flex; }
        
        #summary.active { display: grid; grid-template-columns: 360px 1fr; }
        .col-side { border-right: 1px solid var(--border); overflow-y: auto; padding: 25px; background: #0f0f12; }
        .col-main { overflow-y: auto; background: var(--bg); }

        .art-box { width: 100%; aspect-ratio: 1; background: #000; border-radius: 4px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--border); }
        .art-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .meta-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        .meta-table td { padding: 14px 0; border-bottom: 1px solid #222; font-size: 11px; vertical-align: top; }
        .label { color: var(--mute); font-size: 9px; text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 4px; }
        .value { font-family: 'JetBrains Mono'; color: #fff; display: block; text-align: left; }

        .hero { padding: 35px 40px; border-bottom: 1px solid var(--border); background: linear-gradient(to bottom, #1a1a20, #0c0c0e); }
        .hero h1 { margin: 0; font-size: 26px; font-weight: 700; }
        .hero p { margin: 5px 0; color: var(--mute); font-size: 14px; }

        .data-grid { width: 100%; border-collapse: collapse; }
        .data-grid th { text-align: left; padding: 12px 20px; font-size: 10px; text-transform: uppercase; color: var(--mute); border-bottom: 1px solid var(--border); background: #000; position: sticky; top: 0; z-index: 5; }
        .data-grid td { padding: 14px 20px; border-bottom: 1px solid #1c1c21; font-size: 12px; }
        .btn { background: var(--panel); color: #fff; border: 1px solid var(--border); padding: 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; width: 100%; margin-bottom: 10px; text-align: center; text-decoration: none; display: block; transition: 0.2s; }
    </style>
</head>
<body onload="initApp()">

<header>
    <div class="logo">SNAPPER<span>BASE</span></div>
    <div class="search-wrap">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="omniSearch" placeholder="SEARCH BARCODE, CAT# OR ARTIST...">
    </div>
    <div style="font-size: 10px; color: var(--mute); font-family: 'JetBrains Mono';">STATUS: <span id="sysStatus" style="color:var(--warn)">BOOTING</span></div>
</header>

<div class="workspace">
    <nav>
        <div class="nav-item active" data-target="summary">Summary View</div>
        <div class="nav-item" data-target="schedule">Global Schedule</div>
        <div class="nav-item" data-target="manufacturing">Manufacturing Specs</div>
    </nav>

    <main id="summary" class="view active">
        <section class="col-side">
            <div class="art-box" id="artBox"><img id="mainArt" style="display:none;"></div>
            <table class="meta-table">
                <tr><td class="label">Catalogue</td><td class="value" id="vCat">—</td></tr>
                <tr><td class="label">Barcode</td><td class="value" id="vBar">—</td></tr>
                <tr><td class="label">Price</td><td class="value" id="vPrice">—</td></tr>
            </table>
            <button class="btn" onclick="window.print()">Print View</button>
        </section>
        <section class="col-main">
            <div class="hero"><h1 id="vTitle">Ready</h1><p id="vArtist">V49 Aggressive Sync Active.</p></div>
            <table class="data-grid">
                <thead><tr><th width="60">Pos</th><th>Track Title</th><th width="150">ISRC / Time</th></tr></thead>
                <tbody id="trackBody"></tbody>
            </table>
        </section>
    </main>

    <main id="schedule" class="view">
        <div id="schGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto;"></div>
    </main>

    <main id="manufacturing" class="view">
        <div style="flex:1; overflow:auto;"><table class="data-grid"><thead><tr><th>Cat#</th><th>Spec</th><th>Vinyl Colour</th></tr></thead><tbody id="mfgBody"></tbody></table></div>
    </main>
</div>

<script>
    const DT = "JBNEsUFZFiikzlnsfPHkYTUylwabptrlbtwspVyC"; 
    let db = { cat: [], trk: [], mfg: [] };
    let storage;

    // --- 1. THE AUTO-SYNC BOOT ---
    async function initApp() {
        const request = indexedDB.open("SnapperBaseDB", 1);
        request.onupgradeneeded = (e) => { 
            e.target.result.createObjectStore("files", { keyPath: "id" }); 
        };
        
        request.onsuccess = async (e) => {
            storage = e.target.result;
            document.getElementById('sysStatus').innerText = "SYNCING...";
            
            const files = [
                { id: 'cat', name: 'catalog_6.csv' },
                { id: 'trk', name: 'Tracks_6.csv' },
                { id: 'mfg', name: 'maun_4.csv' }
            ];

            for (const file of files) {
                try {
                    const response = await fetch(file.name);
                    const text = await response.text();
                    db[file.id] = parseCSV(text);
                } catch (err) {
                    console.error("Missing file: " + file.name);
                }
            }
            
            document.getElementById('sysStatus').innerText = "LIVE";
            document.getElementById('sysStatus').style.color = "var(--success)";
            renderAll();
        };
    }

    function parseCSV(text) {
        const rows = text.split(/\r?\n/).filter(l => l.trim() !== '');
        if(!rows.length) return [];
        const headers = rows[0].split(',').map(h => h.trim().replace(/"/g,''));
        return rows.slice(1).map(row => {
            let cells = [], cur = '', q = false;
            for(let char of row) {
                if(char === '"') q = !q; else if(char === ',' && !q) { cells.push(cur.trim()); cur = ''; } else cur += char;
            }
            cells.push(cur.trim());
            let o = {}; headers.forEach((h, i) => o[h] = cells[i] ? cells[i].replace(/"/g,'') : '');
            return o;
        });
    }

    function getVal(obj, aliases) {
        if(!obj) return '—';
        for (let a of aliases) {
            let k = Object.keys(obj).find(key => key.toLowerCase().replace(/[\s_]/g, '') === a.toLowerCase().replace(/[\s_]/g, ''));
            if (k && obj[k] && obj[k].trim() !== '') return obj[k];
        }
        return '—';
    }

    function renderAll(f = '') {
        const term = f.toUpperCase();
        
        // Global Schedule (Limited to 100 for mobile snappiness)
        const items = db.cat.filter(i => getVal(i, ['catalogue','title','artist']).toUpperCase().includes(term));
        document.getElementById('schGrid').innerHTML = items.slice(0, 100).map(i => `
            <div class="sch-card" style="background:var(--panel); border:1px solid var(--border); padding:15px; border-radius:6px; cursor:pointer;" onclick="loadRecord('${getVal(i, ['catalogue'])}')">
                <div style="font-weight:700;">${getVal(i, ['title'])}</div>
                <div style="font-size:11px; color:var(--mute)">${getVal(i, ['artist'])}</div>
            </div>`).join('');

        // Manufacturing Specs
        const mfgs = db.mfg.filter(m => getVal(m, ['catalogue']).toUpperCase().includes(term));
        document.getElementById('mfgBody').innerHTML = mfgs.slice(0, 100).map(m => `
            <tr><td>${getVal(m, ['catalogue'])}</td><td>${getVal(m, ['package'])}</td><td>${getVal(m, ['vinylcolour'])}</td></tr>`).join('');
    }

    function loadRecord(id) {
        const item = db.cat.find(x => getVal(x, ['catalogue']).toUpperCase() === id.toUpperCase());
        if(!item) return;
        document.getElementById('vCat').textContent = getVal(item, ['catalogue']);
        document.getElementById('vBar').textContent = getVal(item, ['upcean']);
        document.getElementById('vTitle').textContent = getVal(item, ['title']);
        document.getElementById('vArtist').textContent = getVal(item, ['artist']);
        
        const tracks = db.trk.filter(t => getVal(t, ['catalogue']).toUpperCase() === id.toUpperCase());
        document.getElementById('trackBody').innerHTML = tracks.map(t => `
            <tr><td>${getVal(t, ['tracknumber'])}</td><td>${getVal(t, ['trackname'])}</td><td>${getVal(t, ['isrc'])}</td></tr>`).join('');
        
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('summary').classList.add('active');
    }

    document.getElementById('omniSearch').oninput = (e) => renderAll(e.target.value);
    document.querySelectorAll('.nav-item').forEach(i => i.onclick = () => {
        document.querySelectorAll('.nav-item, .view').forEach(el => el.classList.remove('active'));
        i.classList.add('active'); document.getElementById(i.dataset.target).classList.add('active');
    });
</script>
</body>
</html>
